    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-sunset.svg?color_snake=#b71c1c&color_dots=#ebedf0,#ffe0b2,#ffb74d,#fb8c00,#e65100
            dist/snake-sunset-dark.svg?color_snake=#ff5252&color_dots=#2d333b,#ffe0b2,#ffb74d,#fb8c00,#e65100

      - name: Generate Pac-Man graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
