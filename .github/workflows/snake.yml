name: Generate Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Apply Sunset colors
        run: |
          sed -i \
            -e 's/#9be9a8/#ffe0b2/gI' -e 's/#40c463/#ffb74d/gI' \
            -e 's/#30a14e/#fb8c00/gI' -e 's/#216e39/#e65100/gI' \
            -e 's/#0e4429/#ffe0b2/gI' -e 's/#006d32/#ffb74d/gI' \
            -e 's/#26a641/#fb8c00/gI' -e 's/#39d353/#e65100/gI' \
            dist/*.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
